<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>园丁AI学习助手</title>
  <script>
    // rem 适配
    !(function(n){function f(){var e=n.document.documentElement,r=e.getBoundingClientRect(),width=r.width,height=r.height,arr=[width,height].filter(function(value){return Boolean(value)}),w=Math.min.apply(Math,arr),x=40*w/750;e.style.fontSize=x>=40?"40px":x<=20?"20px":x+"px"}n.addEventListener("resize",(function(){f()})),f()})(window);

    // --------------------------
    // 核心：API 地址拦截 + 跨域补丁
    // --------------------------
    const COZE_API = "https://api.coze.cn"; // 国内正式接口
    const originalFetch = window.fetch;
    window.fetch = async function(input, init) {
      let url = typeof input === "string" ? input : input.url;

      // 1. 把相对路径 /api/xxx 改成真实 coze 接口
      if (url.startsWith("/api/")) {
        url = COZE_API + url.replace("/api", "/open_api/v2");
      }

      // 2. 把 Coze 内部硬编码的 api.coze.com 换成国内
      url = url.replace("api.coze.com", "api.coze.cn");

      // 3. 跨域头（H5 必须）
      const newInit = {
        ...init,
        credentials: "include",
        headers: {
          ...init?.headers,
          "Access-Control-Allow-Origin": "*",
          "Access-Control-Allow-Methods": "GET,POST,OPTIONS"
        }
      };

      const newInput = typeof input === "string" ? url : new Request(url, input);
      return originalFetch(newInput, newInit);
    };

    // 跳过微信检测
    Object.defineProperty(navigator, 'userAgent', {
      value: 'Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/605.1.15 Safari/605.1.15',
      configurable: true
    });
    window.MicroMessenger = undefined;
  </script>

  <!-- 资源路径完全匹配你仓库里的文件名 -->
  <script type="module" crossorigin src="./js/app.7c1f92b5.js"></script>
  <link rel="modulepreload" crossorigin href="./js/vendors.5f89d091.js">
  <link rel="modulepreload" crossorigin href="./js/common.c7cd8a45.js">
  <link rel="stylesheet" href="./css/vendors.8886af03.css">
  <link rel="stylesheet" href="./css/index.265fe25c.css">
</head>
<body>
  <div id="app">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#666"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="
        position: fixed;
        inset: 0;
        margin: auto;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
      ">
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </div>
</body>
</html>
